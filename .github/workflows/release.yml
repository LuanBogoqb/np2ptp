name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: np2ptp
            asset_name: np2ptp-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: np2ptp.exe
            asset_name: np2ptp-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release -p np2ptp-node --target ${{ matrix.target }}

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "dist/${{ matrix.asset_name }}"

      - name: Sign artifact
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          CERT_ENC: ${{ secrets.CERT_ENC }}
          CERT_PASS: ${{ secrets.CERT_PASS }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          $thumbprint = $null
          try {
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:CERT_ENC))
            $securePass = ConvertTo-SecureString -String $env:CERT_PASS -Force -AsPlainText
            $cert = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $securePass
            $thumbprint = $cert.Thumbprint

            $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter "signtool.exe" -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match "x64" } | Select-Object -First 1 -ExpandProperty FullName

            & $signtool sign /sha1 $thumbprint /fd sha256 /tr http://timestamp.digicert.com /td sha256 "dist/${{ matrix.asset_name }}"
            if ($LASTEXITCODE -ne 0) { throw "signtool failed with exit code $LASTEXITCODE" }
          }
          finally {
            if (Test-Path $pfxPath) { Remove-Item $pfxPath -Force }
            if ($thumbprint) { Remove-Item "Cert:\CurrentUser\My\$thumbprint" -Force -ErrorAction SilentlyContinue }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # `np2ptp update` verifies the Linux binary against this file, since
      # there is no Authenticode signature to pin there. Without it the Linux
      # update path refuses every download.
      - name: Checksum the assets
        run: |
          cd dist
          sha256sum np2ptp-* > SHA256SUMS
          cat SHA256SUMS

      # Embedders (e.g. the Hydra fork) verify SHA256SUMS against this
      # detached minisign signature before trusting any hash in it. The
      # public key is pinned on their side; a release without a valid
      # .minisig is rejected by their updaters (fail-closed).
      - name: Sign SHA256SUMS (minisign)
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/minisign.key"
          minisign -S -W -s "$RUNNER_TEMP/minisign.key" \
            -m dist/SHA256SUMS -x dist/SHA256SUMS.minisig \
            -t "np2ptp release $GITHUB_REF_NAME"
          rm -f "$RUNNER_TEMP/minisign.key"
          cat dist/SHA256SUMS.minisig

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
